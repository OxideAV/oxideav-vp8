[package]
name = "oxideav-vp8"
version = "0.1.13"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-vp8"
authors = ["Mark Karpeles"]
description = "Pure-Rust VP8 video codec — orphan-rebuild scaffold pending clean-room re-implementation."

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-vp8"
keywords = ["multimedia", "video", "vp8", "codec", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]
registry = ["dep:oxideav-core"]
