[package]
name = "oxideav-vp8"
version = "0.2.7"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-vp8"
authors = ["Mark Karpeles"]
description = "Pure-Rust VP8 video codec — orphan-rebuild scaffold pending clean-room re-implementation."

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-vp8"
keywords = ["multimedia", "video", "vp8", "codec", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]
registry = ["dep:oxideav-core"]
# `simd` opts into the §14.3 / §14.4 transform vectorised kernels
# under `core::simd::Simd<i32, 4>` (the WHT and IDCT each pull four
# lanes per pass — see `src/inverse_transform.rs`/`src/forward_transform.rs`,
# `inverse_wht_4x4_simd`/`inverse_dct_4x4_simd`/`forward_*`), the
# §14.1 dequantize kernel under `Simd<i32, 16>` (sixteen independent
# coefficient×factor multiplies per 4×4 block — see `src/dequant.rs`,
# `dequant_block_simd`), the §12.2 TM_PRED intra kernel under
# `Simd<i16, N>` row vectors (N = 16 luma / 8 chroma — see
# `src/intra_predict.rs`, `predict_tm_simd`), and the §18.3 / §20.14
# six-tap sub-pixel interpolation kernel under `Simd<i32, 4>` row
# vectors (four independent dot products per convolution row — see
# `src/motion_comp.rs`, `sixtap_2d_simd`). Requires a nightly
# toolchain because `core::simd` is currently nightly-only. The
# default (stable) build keeps the scalar fallback bit-for-bit
# identical to the spec listing; the SIMD path is byte-exact against
# the scalar path on every test fixture
# (`dct_simd_matches_scalar_on_stress_inputs`,
# `wht_simd_matches_scalar_on_stress_inputs`,
# `dequant_block_simd_matches_scalar_on_stress_inputs`,
# `predict_tm_simd_matches_scalar_on_stress_inputs`, and
# `sixtap_2d_simd_matches_scalar_on_stress_inputs` enforce that,
# both on stable and on nightly+simd).
simd = []

[dev-dependencies]
criterion = "0.5"

# Round 170 benches. Each bench is a self-contained criterion binary
# under `benches/` that synthesises its inputs in-bench (no committed
# fixture files). The first three drive whole-frame encode/decode; the
# last three micro-bench §14 / §11 / §15 hot-path primitives.
[[bench]]
name = "keyframe_encode"
harness = false

[[bench]]
name = "keyframe_decode"
harness = false

[[bench]]
name = "inter_encode_short_clip"
harness = false

[[bench]]
name = "inverse_transform_4x4"
harness = false

[[bench]]
name = "motion_comp_subpel_luma"
harness = false

[[bench]]
name = "intra_predict_dc16"
harness = false

[[bench]]
name = "loop_filter_normal"
harness = false

# Round 194 bench. Sweeps `KeyframeParams::y_ac_qi` (the §9.6 baseline
# quantiser index, the principal rate-control knob) across 10 values
# on the same 320×240 deterministic source used by `keyframe_encode`,
# so readers can pair wall-time throughput with output-byte cost when
# tuning the dial.
[[bench]]
name = "rate_control_qi_sweep"
harness = false

# Round 220 bench. The §14.3 / §14.4 forward primitives — the encoder
# partners of the round-170 `inverse_transform_4x4` micro-bench. They
# fire on every coded residual block, so a stable A/B target for
# future SIMD / unroll work on the forward path was overdue. Inputs
# match the inverse micro-bench so the two pass numbers compare
# directly.
[[bench]]
name = "forward_transform_4x4"
harness = false

# Round 260 bench. The §15.3 `MBfilter` wide inter-macroblock loop
# filter — the heavier sibling of the round-170 `loop_filter_normal`
# (which covers only `subblock_filter` + `simple_segment`). `mb_filter`
# fires on every MB-to-MB edge (up to twice per non-skipped luma MB
# plus the chroma analogues) and executes three decaying clamp/s2u
# adjustments per call, so it dominates per-call cost on the deblock
# path even though `subblock_filter` dominates by call count. Both
# branches are benched (low-variance wide + high-variance hev fallback)
# plus the §15.2 `common_adjust` leaf so future SIMD / unroll work has
# a baseline for the inner core in isolation.
[[bench]]
name = "loop_filter_mb_edge"
harness = false

# Round 282 benches — the decoder-side whole-frame gaps. The decode
# half of the §16 inter roundtrip (`Vp8DecoderState` consuming the same
# 1K+3P 128×128 stream `inter_encode_short_clip` produces) had no bench
# at all, and the §15 / §20.6 whole-frame loop-filter pass (`filter_frame`
# / `filter_inter_frame` — per-MB level resolution + skip rules + the
# raster MB-edge / sub-block-edge cascade) was only covered at the
# per-edge primitive layer (`loop_filter_normal`, `loop_filter_mb_edge`).
[[bench]]
name = "inter_decode_short_clip"
harness = false

[[bench]]
name = "loop_filter_frame"
harness = false

# Round 255 bench. The §17.1 / §18.3 luma motion-search descent ladder
# — `small_diamond_search_luma` (whole-pixel), `half_pixel_refine_luma`
# (8 half-pixel offsets) and `quarter_pixel_refine_luma` (8 quarter-pixel
# offsets) — plus a composite `full_descent_whole_half_quarter` number.
# Every encoded inter MB walks the ladder, so a stable A/B target for
# future search-shape rewrites (hex, full-search, SAD SIMD fan-out) was
# overdue. Sits one layer above `motion_comp_subpel_luma` and one layer
# below `inter_encode_short_clip`.
[[bench]]
name = "motion_search_descent"
harness = false

# Round 285 benches — harnesses for the r283/r284 hot paths. `token_decode`
# isolates the fused §13.2 token-descent layer (dense + sparse 64-MB
# partitions produced by the crate's own §13 encoder and verified at setup)
# and adds an inter-heavy 1K+11P 176×144 whole-stream decode;
# `reconstruct_inter_mb` times the §14.2/§18 per-MB inter reconstruction
# orchestrator (the round-283 #1 decoder self-time symbol) in its three
# workload shapes; `subpel_sad_scoring` is the per-candidate encoder SAD
# micro-bench the "sub-pixel SAD without patch materialisation" candidate
# asked for (half-/quarter-/whole-pel `mb_luma_sad_at_mv` + the halo fetch
# share in isolation).
[[bench]]
name = "token_decode"
harness = false

[[bench]]
name = "reconstruct_inter_mb"
harness = false

[[bench]]
name = "idct_add_residue_fusion"
harness = false

[[bench]]
name = "subpel_sad_scoring"
harness = false

# Round 288 bench. The §9.7 / §9.8 reference-frame slot rotation — the
# per-frame `RefFrameSlot` clone churn `Vp8DecoderState::decode_frame`
# runs after every decoded frame (`copy_arf → copy_gf → refresh_gf →
# refresh_arf → refresh_last`). The round-285/286 ranked decoder table
# named this the standing runner-up profile-opt target (the `memmove` /
# `memset` family, ≈ 15–16 % decoder self-time, #3 cluster) but it had no
# isolated bench: every whole-frame decode bench folds the rotation in
# behind parse + tokens + reconstruct + loop filter. Two layers: the
# rotation walk in isolation across flag combinations (refresh-last-only
# / refresh-all / cross-slot-copy) plus whole-stream decodes under a
# refresh-last vs golden/altref cadence.
[[bench]]
name = "ref_slot_rotation"
harness = false

# Round 291 bench. The §13.4 `token_prob_update()` flag-read loop —
# 1056 update flags (4×8×3×11) parsed at position-specific
# `COEFF_UPDATE_PROBS` probabilities once per frame in
# `coded_header::parse_token_prob_update`. The round-288 ranked decoder
# table named this the standing #5 self-time target (≈ 5 %, the
# specialised flag-read loop) but it had no isolated A/B instrument: the
# whole-frame decode benches fold it inside the rest of the §9 header
# parse. Two payload shapes: the common all-`None` (no updates) frame and
# a sparse-update frame that exercises the L(8) literal-read branch.
[[bench]]
name = "token_prob_update"
harness = false

# Round 292 bench. The §12.3 4×4 B_PRED sub-block intra predictor
# (`intra_predict::predict_b4x4`) — the per-sub-block directional intra
# path that a B_PRED macroblock invokes sixteen times (once per 4×4 luma
# sub-block). The 16×16/8×8 whole-block predictors are already isolated
# (`intra_predict_dc16`), but B_PRED — the dominant luma intra mode on
# detailed keyframe content — was only ever exercised folded inside the
# whole-frame keyframe-decode bench. Covers all ten directional modes
# individually plus a full sixteen-sub-block macroblock loop.
[[bench]]
name = "intra_predict_b4x4"
harness = false

# Round 295 — the §7.3 boolean entropy decoder primitive in isolation.
# `read_bool` / `read_literal` and the batched renormalisation step are
# the most-invoked decode primitive (every coded bit goes through them),
# but were only ever measured wrapped inside the token descent + whole-
# frame decode. Three regimes: skewed (renorm fast path), balanced (renorm
# worst case), and the L(n) literal accumulator.
[[bench]]
name = "bool_decoder_read"
harness = false

# Round 298 — the §14.1 dequantization layer in isolation. Two layers ran
# on the decode path with no isolated harness (both folded inside the
# whole-frame decode benches): the §20.4 `dequant_init` factor derivation
# (`from_quant_indices` per-frame + `for_segment` per-segment, six
# `dc_qlookup`/`ac_qlookup` reads + the `*2` / `*155/100` scalings + the
# `>132` / `<8` clamps) and the per-MB apply (`dequantize`, 400 coeff×factor
# multiplies over all twenty-five 4×4 blocks of a macroblock). The apply is
# the SIMD/unroll A/B target — `dequant_block` already carries an optional
# `core::simd` path. Apply benched at sparse + dense coefficient densities.
[[bench]]
name = "dequantize_mb"
harness = false

# Round 409 benches — two public hot layers that still had no isolated
# harness. `arnr_build_altref` drives the motion-compensated temporal
# filter behind the §9.7 altref anchor (per-16×16-block whole-pel
# refinement search + difference-weighted blend) across a static-noise
# window, a translating window, and the strength-0 pass-through floor.
# `bool_encoder_write` is the §7.3 boolean *encoder* twin of the
# round-295 `bool_decoder_read` bench — the skewed / balanced
# `write_bool` regimes plus the `write_literal` / `write_signed_literal`
# L(n) idioms, each stream round-trip-verified through the crate's own
# decoder at setup.
[[bench]]
name = "arnr_build_altref"
harness = false

[[bench]]
name = "bool_encoder_write"
harness = false
