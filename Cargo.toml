[package]
name = "oxideav-vp8"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/OxideAV/oxideav-vp8"
authors = ["Mark Karpeles"]
description = "Pure-Rust VP8 video decoder for oxideav (RFC 6386, I-frame decode + IVF container)"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-vp8"
keywords = ["multimedia", "video", "vp8", "codec", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
oxideav-core = "0.1"

# Self-contained workspace marker so `cargo test` from inside this crate
# does not walk up into the parent monorepo workspace (which may contain
# unrelated crates that fail to load). The crate ships standalone via
# crates.io and is built standalone in CI; this empty workspace keeps
# in-tree test runs equally hermetic.
[workspace]
