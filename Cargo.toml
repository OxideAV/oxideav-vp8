[package]
name = "oxideav-vp8"
version = "0.2.3"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-vp8"
authors = ["Mark Karpeles"]
description = "Pure-Rust VP8 video codec — orphan-rebuild scaffold pending clean-room re-implementation."

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-vp8"
keywords = ["multimedia", "video", "vp8", "codec", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]
registry = ["dep:oxideav-core"]
# `simd` opts into the §14.3 / §14.4 inverse-transform vectorised
# kernels under `core::simd::Simd<i32, 4>` (the WHT and IDCT each
# pull four lanes per pass — see `src/inverse_transform.rs`,
# `inverse_wht_4x4_simd` and `inverse_dct_4x4_simd`). Requires a
# nightly toolchain because `core::simd` is currently nightly-only.
# The default (stable) build keeps the scalar fallback bit-for-bit
# identical to the spec listing; the SIMD path is byte-exact against
# the scalar path on every test fixture (`dct_simd_matches_scalar_on_stress_inputs`
# and `wht_simd_matches_scalar_on_stress_inputs` enforce that, both
# on stable and on nightly+simd).
simd = []

[dev-dependencies]
criterion = "0.5"

# Round 170 benches. Each bench is a self-contained criterion binary
# under `benches/` that synthesises its inputs in-bench (no committed
# fixture files). The first three drive whole-frame encode/decode; the
# last three micro-bench §14 / §11 / §15 hot-path primitives.
[[bench]]
name = "keyframe_encode"
harness = false

[[bench]]
name = "keyframe_decode"
harness = false

[[bench]]
name = "inter_encode_short_clip"
harness = false

[[bench]]
name = "inverse_transform_4x4"
harness = false

[[bench]]
name = "motion_comp_subpel_luma"
harness = false

[[bench]]
name = "intra_predict_dc16"
harness = false

[[bench]]
name = "loop_filter_normal"
harness = false

# Round 194 bench. Sweeps `KeyframeParams::y_ac_qi` (the §9.6 baseline
# quantiser index, the principal rate-control knob) across 10 values
# on the same 320×240 deterministic source used by `keyframe_encode`,
# so readers can pair wall-time throughput with output-byte cost when
# tuning the dial.
[[bench]]
name = "rate_control_qi_sweep"
harness = false
