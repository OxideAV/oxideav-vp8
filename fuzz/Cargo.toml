[package]
name = "oxideav-vp8-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# oxideav-vp8 is the pure-Rust VP8 video codec (RFC 6386). This fuzz
# crate exercises the public encode and decode entry points with
# arbitrary attacker bytes — none of them may ever panic, abort, or
# index out of bounds. Targets cover the layered surface:
#
#   * `panic_free_decode_keyframe`  — one-shot `decode_vp8`
#   * `panic_free_decoder_state`    — stateful multi-frame
#                                     `Vp8DecoderState::decode_frame`
#                                     (LAST / GOLDEN / ALTREF carry-over,
#                                      extreme reference-frame dependency)
#   * `parse_headers`               — `frame_tag::parse_header`,
#                                     `parse_keyframe_header`,
#                                     `Vp8FrameHeader::parse`,
#                                     `Vp8CodedHeader::parse` (malformed
#                                     segmentation maps, MB-LF
#                                     adjustments, token-prob updates,
#                                     MV-prob updates) and the IVF
#                                     framing layer (`ivf::parse_header`
#                                     / `ivf::parse_frame_header`).
#   * `panic_free_encode_keyframe`  — public `encode_keyframe(&I420Frame,
#                                     &KeyframeParams)` driver: exercises
#                                     both the happy-path §11 mode pick
#                                     → §14 forward transform → §13
#                                     token emission → §15 loop filter
#                                     reconstruct chain, AND the
#                                     parameter-rejection surface
#                                     (`QuantIndexOutOfRange` /
#                                      `LoopFilterLevelOutOfRange` /
#                                      `SharpnessLevelOutOfRange` /
#                                      `InvalidDctPartitionCount`).
#   * `panic_free_two_pass_stream`  — multi-frame `Vp8TwoPassEncoder`:
#                                     `first_pass_analyze` → `encode_frame`
#                                     loop with random configs and
#                                     scene-cut bitmaps, exercising the
#                                     §9.7 reference-frame refresh
#                                     ladder, the keyframe-vs-Pframe
#                                     switching state machine, and the
#                                     complexity-aware qindex picker
#                                     across the full delta envelope.
#                                     The only public encoder entry
#                                     point that reaches
#                                     `encode_p_frame_multi_ref`.
#   * `panic_free_loopfilter_segment` — §15 per-segment primitives
#                                     (`common_adjust`, `simple_segment`,
#                                     `subblock_filter`, `mb_filter`)
#                                     plus the §15.4
#                                     `LoopFilterParams::derive`
#                                     parameter derivation. Drives the
#                                     `(seg.len(), base)` envelope so
#                                     the slice-arithmetic boundary
#                                     conditions the higher-level
#                                     decode / encode harnesses cannot
#                                     reach (they gate §15 behind a
#                                     fully-formed reconstruction
#                                     raster) are exercised directly.
#   * `panic_free_motion_search_descent` — §17.1 / §18.3 luma motion-search
#                                     descent ladder
#                                     (`small_diamond_search_luma`,
#                                     `half_pixel_refine_luma`,
#                                     `quarter_pixel_refine_luma`) plus
#                                     the per-candidate evaluators
#                                     `mb_luma_sad_at_whole_mv` /
#                                     `mb_luma_sad_at_mv`. Drives the
#                                     (mb-position, mv-center,
#                                     plane-dimension, source-block)
#                                     envelope into the §20.14
#                                     edge-replication clamp inside
#                                     `fetch_block_halo` and across
#                                     every §18.3 sixtap fractional
#                                     offset — the corner of the
#                                     configuration space the
#                                     round-255 `motion_search_descent`
#                                     criterion bench never visits
#                                     (it pins the MB at (1, 1) inside
#                                     a 64×64 plane so the SAD
#                                     landscape stays clear of the
#                                     clamp).
#   * `panic_free_sixtap_subpel`   — §18.3 / §20.14 sub-pixel synthesis
#                                     primitives `filter_block_4x4`,
#                                     `sixtap_2d`, `fetch_block_halo`,
#                                     `fetch_block_whole_pixel`,
#                                     `filter_set_for_version`. The
#                                     round-256 motion_search target
#                                     reaches these only through the
#                                     §17 descent ladder (which by
#                                     construction snaps every MV to
#                                     the half- or quarter-pixel grid)
#                                     and the round-225 motion_comp
#                                     bench only exercises a fixed
#                                     `(mx, my) = (6, 6)` choice
#                                     mid-plane; this target drives
#                                     every (mx, my) ∈ {0..7}²
#                                     fractional combination, both
#                                     filter-set arms (sixtap version
#                                     0 / bilinear other versions),
#                                     and every border-position class
#                                     (top-left corner, bottom-right
#                                     corner, adversarial, mid-plane
#                                     fast path) directly. An
#                                     attacker-shaped 81-byte halo
#                                     fed straight into `sixtap_2d`
#                                     also exercises convolution
#                                     patterns the §20.14 fetch's
#                                     edge-replication clamp would
#                                     never produce.
#   * `panic_free_intra_predict_kernels` — §12 intra-prediction pixel
#                                     kernels `predict_y16x16_dc`,
#                                     `predict_y16x16_v`,
#                                     `predict_y16x16_h`,
#                                     `predict_y16x16_tm`,
#                                     `predict_y16x16` (dispatcher),
#                                     `predict_uv8x8_dc`,
#                                     `predict_uv8x8_v`,
#                                     `predict_uv8x8_h`,
#                                     `predict_uv8x8_tm`,
#                                     `predict_uv8x8` (dispatcher),
#                                     and `predict_b4x4` across all
#                                     ten `IntraBmode` arms (round
#                                     259). The seven decode / encode
#                                     harnesses above reach §12 only
#                                     through `decode_vp8` /
#                                     `Vp8DecoderState::decode_frame`
#                                     / `encode_keyframe` /
#                                     `Vp8TwoPassEncoder::encode_frame`,
#                                     which gate the per-block
#                                     prediction kernels behind a
#                                     fully-formed reconstruction
#                                     raster (every neighbour pixel
#                                     pre-sourced, every right-edge
#                                     sub-block `above`-extension
#                                     pre-clamped). The round-258
#                                     `intra_predict_dc16` criterion
#                                     bench only exercises
#                                     `predict_y16x16_dc` / `_v` /
#                                     `_h` against a fixed
#                                     `[128u8; 16] / [129u8; 16]`
#                                     neighbour pair. This target
#                                     drives the §12 primitive surface
#                                     directly: every `Option`
#                                     polarity for `Dc` (`top-left`
#                                     fallback path included), every
#                                     `IntraYMode` arm of the 16×16
#                                     dispatcher (incl. the `B → None`
#                                     short-circuit), every
#                                     `IntraUvMode` arm of the 8×8
#                                     dispatcher, and every
#                                     `IntraBmode` arm of the §12.3
#                                     `predict_b4x4` sub-block
#                                     dispatcher — including the six
#                                     diagonal arms `Ld` / `Rd` /
#                                     `Vr` / `Vl` / `Hd` / `Hu` whose
#                                     assignment lists reference
#                                     different positions of the
#                                     §12.3 `E[0..=8]` synthetic array
#                                     and the `above[4..=7]`
#                                     right-extension pixels.
#   * `panic_free_bool_codec`        — §7 boolean range coder primitives
#                                     driven directly: `BoolDecoder::init`
#                                     + `init_partition` (the §20
#                                     reference's short-input
#                                     fallback), `read_bool` /
#                                     `read_literal` /
#                                     `read_signed_literal` against an
#                                     attacker-shaped (op-type, prob,
#                                     num_bits) schedule, plus the
#                                     write side `BoolEncoder` (`new`
#                                     / `write_bool` / `write_literal`
#                                     / `write_signed_literal` /
#                                     `write_treed` / `finish`). An
#                                     encode-then-decode round-trip
#                                     leg locks the two halves in
#                                     §7.3 lockstep: any asymmetry in
#                                     the `split = 1 + (((range - 1)
#                                     * prob) >> 8)` arithmetic or in
#                                     the `add_one_to_output` carry
#                                     propagation surfaces as a
#                                     mismatch on the read side. The
#                                     ten existing fuzz targets reach
#                                     §7 only through `decode_vp8` /
#                                     `Vp8DecoderState::decode_frame`
#                                     / `Vp8FrameHeader::parse` /
#                                     `decode_block` (decode) or
#                                     `encode_keyframe` /
#                                     `Vp8TwoPassEncoder::encode_frame`
#                                     (encode); the bool coder is
#                                     always the final stage and never
#                                     driven with attacker-shaped
#                                     probability schedules in
#                                     isolation. This target does.
#   * `panic_free_transform_4x4_roundtrip`
#                                  — §14 transform / dequant / residue-
#                                     summation primitive layer driven
#                                     directly: forward DCT / inverse DCT
#                                     and forward WHT / inverse WHT
#                                     round-trip on an attacker-shaped
#                                     `[i16; 16]` residual seed (mid-
#                                     magnitude / ±255 / ±1023 §14.2
#                                     cliff / ±i16::MAX overflow probe),
#                                     `dequant_block` with attacker-
#                                     chosen `(dc_factor, ac_factor)`
#                                     cliff values (`i16::MIN` / `MAX` /
#                                     `0` plus the §14.1 4..=255
#                                     envelope), `add_residue_4x4` +
#                                     `add_residue` (§14.5 fixed-size
#                                     vs arbitrary-length form, byte-
#                                     equality assertion on equal-
#                                     length inputs), `inverse_wht_4x4
#                                     _dc_only` (§14.3 single-non-zero-DC
#                                     fast path, byte-equivalence
#                                     against the general inverse on a
#                                     `[dc, 0, …, 0]` input), the §20.16
#                                     `raster_to_scan` permutation
#                                     (multiset equality between input
#                                     and output asserts the bijection),
#                                     plus the `clamp_qindex` (§9.6) and
#                                     `clamp255` (§14.5) saturating-cap
#                                     primitives at their `i32::MIN` /
#                                     `i32::MAX` cliff endpoints. The
#                                     eleven targets above reach §14
#                                     only indirectly: the decode-side
#                                     targets feed inverse-only via
#                                     well-formed dequantised residuals
#                                     gated by the §9 / §11 / §13 /
#                                     §14.1 state machine; the encode-
#                                     side targets feed forward-only
#                                     via §9.6-clamped residual
#                                     magnitudes determined by the
#                                     upper-layer encoder. No existing
#                                     harness round-trips the §14.3 /
#                                     §14.4 forward + inverse pair on
#                                     attacker-shaped residuals at the
#                                     §14.2 cliff envelope, drives
#                                     `dequant_block` with cliff factor
#                                     pairs, exercises `inverse_wht_4x4
#                                     _dc_only` standalone with cliff
#                                     `dc`, or asserts the §20.16
#                                     `raster_to_scan` permutation
#                                     invariant directly. This target
#                                     does all four.
#   * `panic_free_loop_filter_writeback`
#                                  — §9.4 / §19.2 loop-filter
#                                     parameter writeback layer of the
#                                     public encoder PLUS the small
#                                     §9.5 / §9.6 / §9.10 / §9.11
#                                     sibling writers reached by the
#                                     same §19.2 frame-header walk
#                                     (`write_loop_filter`,
#                                     `write_loop_filter_with_deltas`,
#                                     `LoopFilterDeltas::validate`,
#                                     `LoopFilterDeltas::effective`,
#                                     `write_quant_indices`,
#                                     `write_token_partition_count`,
#                                     `write_mb_no_skip_coeff`). The
#                                     twelve targets above reach the
#                                     encoder writeback layer only
#                                     indirectly through
#                                     `encode_keyframe` /
#                                     `Vp8TwoPassEncoder::encode_frame`,
#                                     which feed NORMALISED parameter
#                                     bytes the upstream
#                                     `KeyframeParams` builder clamped
#                                     to the §9.4 / §9.5 / §9.6
#                                     fields. Neither harness drives
#                                     `write_loop_filter_with_deltas`
#                                     (the §9.4 full-deltas writer
#                                     never ran in either target as
#                                     of round 262 —
#                                     `encode_keyframe`'s key frame
#                                     writes `adj_enable = 0`), nor
#                                     `LoopFilterDeltas::validate` /
#                                     `::effective` (the §15.4 /
#                                     §20.6 carried-state resolution
#                                     is only reached from inter-
#                                     frame encode bodies that gate
#                                     the call behind an `enabled`
#                                     flag the keyframe-only harness
#                                     never sets). The round-232
#                                     `panic_free_loopfilter_segment`
#                                     target reaches §15 only through
#                                     the per-segment kernel layer —
#                                     the kernels consume the §15.4
#                                     derived (`hev_threshold`,
#                                     `interior_limit`, `edge_limit`)
#                                     triple, not the §9.4 wire form.
#                                     A round-trip leg feeds the
#                                     `write_loop_filter_with_deltas`
#                                     output back into
#                                     `BoolDecoder::init` and walks
#                                     the §19.2 field schedule,
#                                     asserting every read value
#                                     equals what the encoder wrote.
#   * `panic_free_inter_mb_reconstruct`
#                                  — §16 inter-MB reconstruction
#                                     surface driven directly:
#                                     `reconstruct_inter_mb_whole_pixel`
#                                     (§16.2 non-SPLITMV whole-pixel),
#                                     `reconstruct_inter_mb` (§16.2 /
#                                     §18.3 full sub-pixel), and
#                                     `reconstruct_split_mv_mb` (§16.4
#                                     SPLITMV) plus their `predict_*`
#                                     residue-free counterparts. The
#                                     thirteen targets above reach §16
#                                     only indirectly through
#                                     `decode_vp8` /
#                                     `Vp8DecoderState::decode_frame`
#                                     / `encode_p_frame_multi_ref` /
#                                     `Vp8TwoPassEncoder::encode_frame`,
#                                     which gate the inter-MB path
#                                     behind a fully-formed previous
#                                     keyframe + §9.7 reference refresh
#                                     state machine; none drive the
#                                     reconstruct entry points with
#                                     attacker-shaped `(mb_col,
#                                     mb_row, luma_mv, full_pixel,
#                                     mb_skip_coeff, y2_coeffs,
#                                     y_coeffs, u_coeffs, v_coeffs)`
#                                     tuples directly. Cross-checks
#                                     (a) the §18.1 fractional gate
#                                     against the
#                                     `MotionCompError::SubPixelNotSupported`
#                                     return on the whole-pixel path,
#                                     and (b) the §11.1
#                                     `mb_skip_coeff` short-circuit
#                                     (predict == recon on every
#                                     input that sets the skip flag)
#                                     on every path.
#   * `panic_free_encode_decode_e2e`
#                                  — per-frame symmetric encode→decode
#                                     round-trip
#                                     (`encode_keyframe` →
#                                     `decode_vp8` on the same
#                                     iteration's bytes). The fourteen
#                                     targets above cover each pipeline
#                                     leg in isolation:
#                                     `panic_free_encode_keyframe`
#                                     stops at the emitted byte buffer;
#                                     `panic_free_decode_keyframe`
#                                     drives `decode_vp8` with
#                                     arbitrary attacker bytes but the
#                                     §9.1 frame-tag pre-screen rejects
#                                     anything that isn't already a
#                                     structurally-valid keyframe
#                                     start. Neither locks the two
#                                     halves in lockstep on the same
#                                     iteration. This target stitches
#                                     them: encode → decode on every
#                                     `(I420Frame, KeyframeParams)`
#                                     pair the encoder accepts. The
#                                     seam where a §7.3 bool-coder
#                                     asymmetry, a §13 token miscount,
#                                     a §9.6 quant-index sign
#                                     confusion, or a §15.4
#                                     loop-filter derivation skew
#                                     would hide is exactly this
#                                     boundary: the encoder's own
#                                     structural invariants suppress
#                                     emission-side panics, and the
#                                     decoder's early validation
#                                     rejects everything except
#                                     self-encoded bitstreams. Asserts
#                                     the §9.1 visible width / height
#                                     round-trip on every successful
#                                     decode (any cross-side drift on
#                                     the wire-form width / height
#                                     surfaces as a mismatch). Distinct
#                                     from r261 `panic_free_bool_codec`
#                                     which drives the §7.3 primitives
#                                     in isolation against an attacker-
#                                     shaped probability schedule;
#                                     this target drives them inside
#                                     the full §11 / §13 / §14
#                                     production chain on encoder-
#                                     shaped probabilities, exposing
#                                     any path where the encoder's
#                                     range-tracking diverges from the
#                                     decoder's even though both
#                                     halves pass their isolated
#                                     sweeps.
#   * `encode_decode_pixel_lockstep`
#                                  — pixel-exact encode→decode lockstep
#                                     differential. The round-264 e2e
#                                     target's oracle stops at the §9.1
#                                     visible width / height round-trip;
#                                     this target compares the decoder's
#                                     full visible Y / U / V output
#                                     byte-for-byte against the
#                                     encoder's own post-§15
#                                     reconstruction planes
#                                     (`encode_keyframe_with_
#                                     reconstruction_and_token_updates`
#                                     returns them; the §15.1 contract
#                                     is that a compliant decoder
#                                     reproduces them exactly). Three
#                                     gaps closed: (1) first pixel-
#                                     content oracle in the suite,
#                                     (2) non-MB-aligned dimensions
#                                     (raw 1..=64 × 1..=144 luma px, so
#                                     the §9.1 partial-MB padding /
#                                     visible-crop seam — including §15
#                                     filtering over the padded raster —
#                                     is in lockstep on almost every
#                                     iteration; the e2e target only
#                                     ever encodes whole-MB frames),
#                                     (3) the §13.4 token_prob_update()
#                                     WRITE path (no other target
#                                     drives it; `parse_headers` /
#                                     `panic_free_token_block` fuzz the
#                                     read side only) with raw 0..=255
#                                     probability bytes — wider than
#                                     the [1, 255] band the in-tree
#                                     fitter emits. Parameters are
#                                     normalised into their legal §9.4 /
#                                     §9.5 / §9.6 ranges, so an Err
#                                     from either side, any dimension /
#                                     MB-grid drift, or any single-byte
#                                     pixel mismatch panics.
#   * `decode_stream_token_descent`
#                                  — full-frame multi-packet decode
#                                     driver aimed at the round-283
#                                     hot-path rewrite: the fused §13.2
#                                     coefficient-tree descent
#                                     (`decode_block_core`), the §20.16
#                                     zigzag-direct coefficient writes
#                                     (`decode_mb_coeffs`), and the §7.3
#                                     batched bool-decoder
#                                     renormalisation. Seeded with
#                                     packet streams derived from the
#                                     crate's `tests/fixtures/` IVF
#                                     corpus (keyframes AND inter
#                                     frames) so mutations corrupt real
#                                     §13 token partitions instead of
#                                     dying at the §9.1 header check.
#                                     Three oracles beyond
#                                     panic-freedom: a fresh
#                                     `Vp8DecoderState` vs one-shot
#                                     `decode_vp8` cross-entry-point
#                                     differential on the first packet
#                                     (Ok/Err polarity + byte-identical
#                                     planes), an FNV-1a fold over every
#                                     decoded plane byte, and — under
#                                     the `simd` feature, this crate's
#                                     default — a scalar-vs-SIMD
#                                     differential over the §14.1 /
#                                     §14.3 / §14.4 / §12.2 / §18.3
#                                     kernel pairs on attacker-shaped
#                                     inputs.
#   * `panic_free_near_mv_mode_decode`
#                                  — §16.2 / §16.3 / §16.4 / §17 inter-MB
#                                     *mode-info decode* surface
#                                     (`decode_inter_mb`,
#                                     `decode_split_mv_mb`,
#                                     `resolve_inter_mb_mv`,
#                                     `find_near_mvs`, `decode_split_mv`,
#                                     `read_inter_mode`,
#                                     `read_mv_partition`, `submv_ref`,
#                                     `above_block_mv` / `left_block_mv`,
#                                     `mv_ref_probs`, `clamp_mv`). Drives
#                                     the §16.3 spatial census + §16.2
#                                     inter-mode tree + §16.4 SPLITMV
#                                     partition walk + §17 NEWMV
#                                     differential from a bool-coder
#                                     partition, with adversarial
#                                     neighbour `MbInfo` records, sign
#                                     bias, and attacker-tiled MV
#                                     probability contexts — the
#                                     bool-decoder-driven mode/MV decode
#                                     the round-263
#                                     `panic_free_inter_mb_reconstruct`
#                                     target (which feeds vectors in
#                                     directly) never reaches, and that
#                                     the `decode_vp8` targets reach only
#                                     through self-consistent §9.7
#                                     reference state. Asserts the §16.3
#                                     census counts stay inside the
#                                     documented 0..=5 `mv_ref_probs`
#                                     index envelope on every iteration.
#   * `panic_free_keyframe_reconstruct`
#                                  — §12 / §14 key-frame intra
#                                     reconstruction core driven directly
#                                     (`frame::decode_keyframe`): an
#                                     arbitrary `mb_cols × mb_rows` grid
#                                     of `MacroblockModes` + (already
#                                     dequantized) `MbCoeffs` synthesised
#                                     from the fuzz bytes, bypassing the
#                                     §9.1 / §19.2 parse gates. Forces the
#                                     full Cartesian product of §12 16×16
#                                     luma modes, §11.3 B_PRED sub-block
#                                     mode mixes, §11.4 chroma modes, the
#                                     `mb_skip_coeff` short-circuit, and
#                                     hostile post-dequant coefficient
#                                     magnitudes through the neighbour
#                                     gather → §14.3 inverse WHT → §14.4
#                                     inverse DCT → §14.5 add-and-clamp
#                                     pass — the reconstruction-walker
#                                     configurations the bitstream-gated
#                                     `decode_vp8` / token-descent targets
#                                     seldom reach. Asserts the documented
#                                     plane geometry and folds every
#                                     produced plane byte into an FNV-1a
#                                     accumulator (short-write oracle).
#   * `ivf_demux_decode_walk`        — the IVF container demux loop feeding
#                                     the stateful decoder. `parse_headers`
#                                     calls `ivf::parse_header` /
#                                     `ivf::parse_frame_header` once each on
#                                     the raw front bytes — it never advances
#                                     a cursor, walks a second record, or
#                                     feeds an extracted payload anywhere;
#                                     `panic_free_decoder_state` /
#                                     `decoder_trait_packet_lifecycle` drive
#                                     `Vp8DecoderState::decode_frame` from a
#                                     synthetic `[u16-LE len][payload]`
#                                     packetiser that inherits NO container
#                                     framing. This target is the real
#                                     `.ivf`-playback loop on attacker bytes:
#                                     `parse_header` → frame-record walk from
#                                     offset 32, carving
#                                     `data[off+12 .. off+12+size]` for each
#                                     32-bit attacker-controlled payload
#                                     `size` and advancing the cursor. The
#                                     `off + 12 + size` term is the
#                                     integer-overflow / out-of-range surface
#                                     a hostile `size` field targets; the
#                                     walk uses checked arithmetic + a
#                                     saturating bounds clamp so a corrupt
#                                     `size` ends the walk cleanly instead of
#                                     panicking. Each carved payload is fed
#                                     to one persistent `Vp8DecoderState`, so
#                                     the §9.7 LAST / GOLDEN / ALTREF ladder
#                                     runs exactly as a multi-frame `.ivf`
#                                     would drive it. Plane-fold FNV-1a oracle
#                                     over every decoded Y / U / V byte.
#   * `decode_multi_partition_carve` — the §9.5 multi-DCT-partition layout
#                                     walk: `carve_dct_partitions` (3-byte
#                                     LE size-table split + per-slice
#                                     bounds) and the §20.4 row-interleaved
#                                     `r % N` partition descent. Builds a
#                                     structurally valid 2/4/8-partition
#                                     key frame with `encode_keyframe`,
#                                     asserts a clean round-trip, then
#                                     mutates the size table, the buffer
#                                     tail, and the §9.1
#                                     `first_partition_size` field — the
#                                     truncation / overshoot branches raw
#                                     bytes essentially never reach because
#                                     they require a self-consistent size
#                                     table behind a valid §19.2 header.
#   * `panic_free_kf_mb_mode_decode` — the §11 key-frame macroblock
#                                     *mode-info* tree walk driven directly
#                                     off a bool-decoder partition:
#                                     `macroblock::parse_key_frame_macroblock_modes`.
#                                     Drives the §10 segment-id 4-leaf
#                                     `MB_SEGMENT_TREE` descent (against
#                                     attacker `mb_segment_tree_probs` with
#                                     the §9.3-item-5 255 fallback per
#                                     entry), the §11.1 `mb_skip_coeff`
#                                     read (attacker `prob_skip_false`), the
#                                     §11.2 key-frame Y-mode tree, the
#                                     §11.3 / §11.5 sixteen-sub-block
#                                     `B_PRED` walk including the
#                                     cross-macroblock `above`/`left`
#                                     sub-block-mode predictor bookkeeping,
#                                     and the §11.4 chroma-mode tree —
#                                     all from an attacker-shaped
#                                     `Vp8CodedHeader` (segmentation /
#                                     skip gates) plus an attacker-shaped
#                                     bool partition. The reconstruction
#                                     target `panic_free_keyframe_reconstruct`
#                                     feeds `decode_keyframe` a grid of
#                                     *already-decoded* `MacroblockModes`
#                                     synthesised from the fuzz bytes — it
#                                     never walks the §11 mode trees; the
#                                     bitstream-gated targets reach this
#                                     function only behind the §9.1 / §19.2
#                                     validation gates, so the only mode
#                                     probabilities they feed it are the
#                                     self-consistent ones a valid header
#                                     carries. The partition is initialised
#                                     with `BoolDecoder::init_partition`
#                                     (the §20 short-input fallback) so a
#                                     truncated / empty partition is a
#                                     first-class input. Oracle: one
#                                     decoded entry per macroblock and
#                                     every decoded `segment_id` inside the
#                                     documented 0..=3 envelope.
#   * `decode_pixel_cap_enforcement` — the §9.1 declared-frame-size DoS cap
#                                     (`decode_vp8_with_max_pixels` /
#                                     `Vp8DecoderState::with_max_pixels_per_frame`,
#                                     round 405). Every other target uses
#                                     either the fixed `accept_dimensions`
#                                     gate (never touching the cap surface)
#                                     or the default cap (which by
#                                     construction never fires on a legal
#                                     14-bit VP8 frame). This target drives
#                                     the cap boundary directly: a reject leg
#                                     sets the cap one pixel below the
#                                     declared size and asserts
#                                     `FrameTooLarge { pixels, cap }` with no
#                                     allocation (safe even at the wire-legal
#                                     268-Mpx extreme), and an accept leg —
#                                     gated on the fuzz alloc budget — sets
#                                     the cap at the declared size and asserts
#                                     any `Ok` decode's visible dimensions
#                                     stay within it, cross-driving the
#                                     stateful builder for panic-freedom.
#
# The harness is a panic-freedom sweep over the public surface.

[features]
# cargo-fuzz always builds on nightly, where the `core::simd` kernels
# compile — so the SIMD dispatch path (the one production nightly
# builds run) is what gets fuzzed by default, and the
# `decode_stream_token_descent` differential leg keeps the scalar
# kernels covered by asserting scalar == SIMD on every iteration.
# Build with `--no-default-features` to fuzz the pure-scalar dispatch.
default = ["simd"]
simd = ["oxideav-vp8/simd"]

[dependencies]
libfuzzer-sys = "0.4"
# Needed by `decoder_trait_packet_lifecycle`, which drives the public
# `oxideav_core::Decoder` trait impl (`Vp8Decoder`) end-to-end:
# `Packet` in, `Frame` out. Resolves to the same published version the
# `oxideav-vp8` path dep already pulls in transitively.
oxideav-core = "0.1"

[dependencies.oxideav-vp8]
path = ".."

[lib]
name = "oxideav_vp8_fuzz"
path = "src/lib.rs"

# Prevent this fuzz package from being pulled into the umbrella
# workspace at `crates/*` glob-resolve time.
[workspace]
members = ["."]

[profile.release]
debug = 1

