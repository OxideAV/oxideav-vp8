[package]
name = "oxideav-vp8"
version = "0.2.3"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-vp8"
authors = ["Mark Karpeles"]
description = "Pure-Rust VP8 video codec — orphan-rebuild scaffold pending clean-room re-implementation."

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-vp8"
keywords = ["multimedia", "video", "vp8", "codec", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]
registry = ["dep:oxideav-core"]
# `simd` opts into the §14.3 / §14.4 transform vectorised kernels
# under `core::simd::Simd<i32, 4>` (the WHT and IDCT each pull four
# lanes per pass — see `src/inverse_transform.rs`/`src/forward_transform.rs`,
# `inverse_wht_4x4_simd`/`inverse_dct_4x4_simd`/`forward_*`) and the
# §14.1 dequantize kernel under `Simd<i32, 16>` (sixteen independent
# coefficient×factor multiplies per 4×4 block — see `src/dequant.rs`,
# `dequant_block_simd`). Requires a nightly toolchain because
# `core::simd` is currently nightly-only. The default (stable) build
# keeps the scalar fallback bit-for-bit identical to the spec listing;
# the SIMD path is byte-exact against the scalar path on every test
# fixture (`dct_simd_matches_scalar_on_stress_inputs`,
# `wht_simd_matches_scalar_on_stress_inputs`, and
# `dequant_block_simd_matches_scalar_on_stress_inputs` enforce that,
# both on stable and on nightly+simd).
simd = []

[dev-dependencies]
criterion = "0.5"

# Round 170 benches. Each bench is a self-contained criterion binary
# under `benches/` that synthesises its inputs in-bench (no committed
# fixture files). The first three drive whole-frame encode/decode; the
# last three micro-bench §14 / §11 / §15 hot-path primitives.
[[bench]]
name = "keyframe_encode"
harness = false

[[bench]]
name = "keyframe_decode"
harness = false

[[bench]]
name = "inter_encode_short_clip"
harness = false

[[bench]]
name = "inverse_transform_4x4"
harness = false

[[bench]]
name = "motion_comp_subpel_luma"
harness = false

[[bench]]
name = "intra_predict_dc16"
harness = false

[[bench]]
name = "loop_filter_normal"
harness = false

# Round 194 bench. Sweeps `KeyframeParams::y_ac_qi` (the §9.6 baseline
# quantiser index, the principal rate-control knob) across 10 values
# on the same 320×240 deterministic source used by `keyframe_encode`,
# so readers can pair wall-time throughput with output-byte cost when
# tuning the dial.
[[bench]]
name = "rate_control_qi_sweep"
harness = false

# Round 220 bench. The §14.3 / §14.4 forward primitives — the encoder
# partners of the round-170 `inverse_transform_4x4` micro-bench. They
# fire on every coded residual block, so a stable A/B target for
# future SIMD / unroll work on the forward path was overdue. Inputs
# match the inverse micro-bench so the two pass numbers compare
# directly.
[[bench]]
name = "forward_transform_4x4"
harness = false

# Round 260 bench. The §15.3 `MBfilter` wide inter-macroblock loop
# filter — the heavier sibling of the round-170 `loop_filter_normal`
# (which covers only `subblock_filter` + `simple_segment`). `mb_filter`
# fires on every MB-to-MB edge (up to twice per non-skipped luma MB
# plus the chroma analogues) and executes three decaying clamp/s2u
# adjustments per call, so it dominates per-call cost on the deblock
# path even though `subblock_filter` dominates by call count. Both
# branches are benched (low-variance wide + high-variance hev fallback)
# plus the §15.2 `common_adjust` leaf so future SIMD / unroll work has
# a baseline for the inner core in isolation.
[[bench]]
name = "loop_filter_mb_edge"
harness = false

# Round 255 bench. The §17.1 / §18.3 luma motion-search descent ladder
# — `small_diamond_search_luma` (whole-pixel), `half_pixel_refine_luma`
# (8 half-pixel offsets) and `quarter_pixel_refine_luma` (8 quarter-pixel
# offsets) — plus a composite `full_descent_whole_half_quarter` number.
# Every encoded inter MB walks the ladder, so a stable A/B target for
# future search-shape rewrites (hex, full-search, SAD SIMD fan-out) was
# overdue. Sits one layer above `motion_comp_subpel_luma` and one layer
# below `inter_encode_short_clip`.
[[bench]]
name = "motion_search_descent"
harness = false
